# Job Finder Configuration File
# Edit these settings to customize your job search

job_search:
  # Job title to search for (can be a list)
  default_titles:
    - "Senior Full Stack Software Engineer"
    - "Senior Full Stack Developer"
    - "Lead Full Stack Engineer"

  # Locations to search (can be multiple)
  default_locations:
    - "New York, NY"
    - "New Jersey, NJ"
    - "Remote"

  # Experience level
  experience_level: "Senior"

  # Job types to include
  job_types:
    - "Full-time"

  # Accept remote jobs
  remote_ok: true

  # Required skills (optional - leave empty for all)
  required_skills:
    - "Python"
    - "JavaScript"
    - "React"
    - "Node.js"

  # Preferred skills (nice to have)
  preferred_skills:
    - "AI/ML"
    - "Cloud"
    - "Docker"
    - "Kubernetes"

matching:
  # Minimum match percentage (jobs below this are ignored)
  min_match_percentage: 60

  # Maximum number of jobs to process per day
  max_jobs_per_day: 5

  # Sort by match score
  sort_by_match: true

resume_customization:
  # === AI RESUME INTELLIGENCE PIPELINE ===
  # Enable the 6-stage AI pipeline for 90%+ success rate
  enable_ai_pipeline: true

  # Parallel workers for processing multiple resumes
  parallel_workers: 5

  # Stage 1: Role Intelligence Analyzer
  role_analysis_model: "gemini-2.5-flash"
  repositioning_aggressiveness: "moderate"  # conservative | moderate | aggressive

  # Stage 2: Narrative Repositioner
  repositioning_model: "gemini-2.5-flash"

  # Stage 3: ATS Optimizer
  target_skill_coverage: 85  # Reduced from 95 to avoid keyword stuffing
  max_bullets_to_modify: 5
  max_tech_list_length: 4    # Prevent keyword stuffing (max 4 items per list)
  ats_model: "gemini-2.5-flash"

  # Stage 4: Authenticity Humanizer
  humanizer_model: "gemini-2.5-flash"
  target_metric_density: 55   # % of bullets with metrics (45-65% optimal, >70% = AI-like)
  personality_bullets_per_resume: 3
  variation_level: "moderate"

  # Stage 5: AI Quality Validator
  validator_model: "gemini-2.5-flash"
  min_overall_score: 85
  min_authenticity_score: 85
  max_validation_retries: 2
  strict_mode: true

  # Stage 6: Final Polisher
  polisher_model: "gemini-2.5-flash"

  # === LEGACY SETTINGS (for backward compatibility) ===
  authenticity_balance: 70
  modification_level: moderate
  max_skills_to_add: 5
  max_experience_age_years: 5
  min_confidence_score: 65
  style: action_focused

  # Generate interview prep guides?
  generate_interview_prep: true
  interview_prep_detail: moderate

  # Generate DOCX resume files?
  generate_docx: true

schedule:
  # Time to run daily (24-hour format)
  run_time: "08:00"

  # Timezone
  timezone: "America/New_York"

  # Days to run (0 = Monday, 6 = Sunday)
  run_days: [0, 1, 2, 3, 4]  # Monday to Friday

resume:
  # Path to your master resume
  master_resume_path: "data/master_resume.json"

  # Output format (pdf, docx, html)
  output_format: "docx"

  # Customize these sections
  customize_sections:
    - "summary"
    - "skills"
    - "experience"

notifications:
  # Your email address (uses GMAIL_USER from .env)
  # If not set here, will read from GMAIL_USER environment variable
  email_to: ""  # Leave empty to use GMAIL_USER from .env

  # Send email notifications
  send_email: true

  # Upload to Google Drive
  upload_to_drive: true

  # Google Drive folder ID (uses GOOGLE_DRIVE_FOLDER_ID from .env)
  # Get from Drive URL: https://drive.google.com/drive/folders/[FOLDER_ID_HERE]
  google_drive_folder_id: ""  # Leave empty to use GOOGLE_DRIVE_FOLDER_ID from .env

sources:
  # Enable/disable job sources
  enabled:
    - "linkedin"
    - "indeed"

  # API keys and configuration
  adzuna:
    app_id: ""  # Get from https://developer.adzuna.com/
    app_key: ""

  jsearch:
    api_key: ""  # Get from RapidAPI

  # Scraping configuration
  scraping:
    use_proxy: false
    max_pages: 3
    delay_between_requests: 2  # seconds

google_cloud:
  # Google Cloud Project ID (uses GOOGLE_CLOUD_PROJECT from .env)
  # Leave empty to use GOOGLE_CLOUD_PROJECT environment variable
  project_id: ""  # Leave empty to use GOOGLE_CLOUD_PROJECT from .env

  # Vertex AI configuration
  vertex_ai:
    location: "us-central1"
    model: "gemini-2.5-flash"

  # Firestore collection names
  firestore:
    jobs_collection: "applied_jobs"
    history_collection: "job_history"

logging:
  # Log level (DEBUG, INFO, WARNING, ERROR)
  level: "INFO"

  # Log to file
  log_to_file: true

  # Log file path
  log_file: "logs/job_finder.log"
